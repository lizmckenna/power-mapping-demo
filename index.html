<style>
  :root {
    /* Groundwork / Linear-aesthetic palette */
    --paper: #ffffff;
    --paper-tint: #fafafa;
    --cream-2: #f4f4f5;

    /* Actor-category accents — kept harmonious with brand purple */
    --terracotta: #b7432b;
    --terracotta-soft: #f4d3cb;
    --olive: #5b7a3a;
    --amber: #c99633;
    --slate: #475569;
    --ego: #0d6b5a;
    --display: "Archivo Narrow", -apple-system, system-ui, sans-serif;

    --serif: var(--display);

    font-family: var(--sans);

  .badge {
    font-family: var(--mono); font-size: 10px; font-weight: 500;
    letter-spacing: 0.1em; text-transform: uppercase;

  .field { margin-bottom: 12px; }

  .face-row:hover { border-color: var(--cobalt-soft); }
  .face-row.selected { background: #e9e0ca; border-color: var(--cobalt); }
  .face-row.zero.selected { background: #f0d9d2; border-color: var(--terracotta); }

/* ========= Faces multi-select ========= */

function FaceSelect({ value, onChange }) {
  const toggle = (n) => {
    let next;
    if (n === 0) {
      next = value.includes(0) ? [] : [0];
    } else {
      const without = value.filter(v => v !== 0);
      next = without.includes(n) ? without.filter(v => v !== n) : [...without, n].sort();
    }
    onChange(next);
  };
  return (
    <div className="faces-grid">
      {FACES.map(f => {
        const selected = value.includes(f.value);
        return (
          <label key={f.value} className={"face-row" + (selected ? " selected" : "") + (f.value === 0 ? " zero" : "")}>
            <input type="checkbox" checked={selected} onChange={() => toggle(f.value)} />
            <span className="face-num">{f.value}</span>
            <span className="face-text">
              <span className="face-label">{f.label}</span>
              <span className="face-desc">{f.desc}</span>
            </span>
          </label>
        );
      })}
    </div>
  );
}

/* ========= Actor form (used for new + edit) ========= */

function MiniGridPicker({ x, y, color, onChange }) {
  const ref = useRef(null);
  const dragging = useRef(false);
  const update = (e) => {
    const r = ref.current.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width;
    const py = (e.clientY - r.top) / r.height;
    const nx = Math.max(-1, Math.min(1, px * 2 - 1));
    const ny = Math.max(-1, Math.min(1, (1 - py) * 2 - 1));
    onChange(Number(nx.toFixed(2)), Number(ny.toFixed(2)));
  };
  const onDown = (e) => { dragging.current = true; update(e); e.preventDefault(); };
  const onMove = (e) => { if (dragging.current) update(e); };
  const onUp = () => { dragging.current = false; };
  useEffect(() => {
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
    return () => {
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", onUp);
    };
  }, []);
  const leftPct = ((x + 1) / 2) * 100;
  const topPct = ((1 - y) / 2) * 100;
  const supportTxt = x === 0 ? "Neutral" : (x > 0 ? "Supporter +" : "Opponent ") + Math.abs(x).toFixed(2);
  const powerTxt = y === 0 ? "Mid-power" : (y > 0 ? "Powerful +" : "Not powerful ") + Math.abs(y).toFixed(2);
  return (
    <div>
      <div className="mini-grid-wrap">
        <div></div>
        <div className="mini-grid-axis-lbl">Powerful</div>
        <div></div>
        <div className="mini-grid-axis-lbl left">Opponent</div>
        <div ref={ref} className="mini-grid" onMouseDown={onDown}>
          <div className="mini-grid-axes"></div>
          <div className="mini-grid-dot" style={{ left: leftPct + "%", top: topPct + "%", background: color }}></div>
        </div>
        <div className="mini-grid-axis-lbl right">Supporter</div>
        <div></div>
        <div className="mini-grid-axis-lbl">Not powerful</div>
        <div></div>
      </div>
      <div className="grid-coord-readout">{supportTxt} · {powerTxt}</div>
    </div>
  );
}

      <div className="field">

        <MiniGridPicker

/* ========= Map ========= */

function NetworkMap({ org, actors }) {
  const svgRef = useRef(null);
  const containerRef = useRef(null);
  const simRef = useRef(null);
  const nodesRef = useRef([]);   // mutable simulation state
  const linksRef = useRef([]);
  const [size, setSize] = useState({ w: 800, h: 600 });
  const [tip, setTip] = useState(null); // {x, y, actor}

  // Resize observer
  useEffect(() => {
    if (!containerRef.current) return;
    const ro = new ResizeObserver((entries) => {
      const r = entries[0].contentRect;
      setSize({ w: r.width, h: r.height });
    });
    ro.observe(containerRef.current);
    return () => ro.disconnect();
  }, []);

  // Sync nodes & links with actors data, run simulation
  useEffect(() => {
    const W = size.w, H = size.h;
    const cx = W / 2, cy = H / 2;

    // Build desired node list
    const desired = [
      { id: "__ego__", isEgo: true, name: org.orgName || "Your Organization", r: 38, fx: cx, fy: cy },
      ...actors.map(a => {
        const t = lookupType(a.actorType);
        const c = lookupConst(a.constituency);
        const hf = highestFace(a.faces);
        return {
          id: a.id,
          actor: a,
          color: t.color,
          r: c.radius,
          highestFace: hf,
        };
      })
    ];

    // Preserve x/y between renders
    const prev = new Map(nodesRef.current.map(n => [n.id, n]));
    const nodes = desired.map(d => {
      const old = prev.get(d.id);
      if (old) return Object.assign(old, d);
      // New node: place near rim
      const angle = Math.random() * Math.PI * 2;
      return Object.assign({
        x: cx + Math.cos(angle) * 180,
        y: cy + Math.sin(angle) * 180
      }, d);
    });

    // Pin ego
    nodes.forEach(n => {
      if (n.isEgo) { n.fx = cx; n.fy = cy; }
      else { n.fx = null; n.fy = null; }
    });

    // Links: ego → each actor, only if face > 0 (face 0 = isolated, no edge)
    const links = nodes
      .filter(n => !n.isEgo && n.highestFace > 0)
      .map(n => ({
        source: "__ego__",
        target: n.id,
        face: n.highestFace,
        distance: 110 + (4 - n.highestFace) * 35
      }));

    nodesRef.current = nodes;
    linksRef.current = links;

    if (!simRef.current) {
      simRef.current = d3.forceSimulation(nodes)
        .force("link", d3.forceLink(links).id(d => d.id).distance(d => d.distance).strength(0.45))
        .force("charge", d3.forceManyBody().strength(-260))
        .force("collide", d3.forceCollide().radius(d => d.r + 8).iterations(2))
        .force("center", d3.forceX(cx).strength(0.02))
        .force("centerY", d3.forceY(cy).strength(0.02))
        .alphaDecay(0.045)
        .velocityDecay(0.55);
    } else {
      simRef.current.nodes(nodes);
      simRef.current.force("link").links(links);
      simRef.current.force("center", d3.forceX(cx).strength(0.02));
      simRef.current.force("centerY", d3.forceY(cy).strength(0.02));
      simRef.current.alpha(0.55).restart();
    }

    // Tick render directly to SVG (avoid React re-renders per tick)
    const svg = d3.select(svgRef.current);
    const linkSel = svg.select(".links").selectAll("line")
      .data(links, d => d.target.id || d.target);
    linkSel.exit().remove();
    const linkEnter = linkSel.enter().append("line").attr("class", "edge");
    const linkAll = linkEnter.merge(linkSel)
      .attr("stroke", d => EDGE_STYLE[d.face].stroke)
      .attr("stroke-width", d => EDGE_STYLE[d.face].width)
      .attr("stroke-dasharray", d => EDGE_STYLE[d.face].dash || "")
      .attr("opacity", d => EDGE_STYLE[d.face].opacity);

    const nodeGroup = svg.select(".nodes").selectAll("g.node")
      .data(nodes, d => d.id);
    nodeGroup.exit().remove();
    const nodeEnter = nodeGroup.enter().append("g").attr("class", "node");
    nodeEnter.append("circle").attr("class", "node-circle");
    nodeEnter.append("text").attr("class", "node-label");
    const nodeAll = nodeEnter.merge(nodeGroup);
    nodeAll.select("circle.node-circle")
      .attr("r", d => d.r)
      .attr("fill", d => d.isEgo ? "#0d3d45" : d.color)
      .attr("stroke", d => d.isEgo ? "#efe6d1" : "rgba(23,21,20,0.25)")
      .attr("stroke-width", d => d.isEgo ? 2.5 : 1)
      .style("opacity", 1);
    nodeAll.select("text.node-label")
      .attr("class", d => "node-label" + (d.isEgo ? " ego" : ""))
      .attr("text-anchor", "middle")
      .attr("dy", d => d.r + 13)
      .text(d => d.isEgo ? d.name : (d.actor?.name || "—"));

    // Hover behaviors
    nodeAll
      .on("mouseenter", function(event, d) {
        if (d.isEgo) return;
        const rect = containerRef.current.getBoundingClientRect();
        setTip({
          x: event.clientX - rect.left,
          y: event.clientY - rect.top,
          actor: d.actor
        });
        d3.select(this).select("circle").attr("stroke-width", 2.5);
      })
      .on("mousemove", function(event, d) {
        if (d.isEgo) return;
        const rect = containerRef.current.getBoundingClientRect();
        setTip(t => t ? { ...t, x: event.clientX - rect.left, y: event.clientY - rect.top } : t);
      })
      .on("mouseleave", function(event, d) {
        if (d.isEgo) return;
        setTip(null);
        d3.select(this).select("circle").attr("stroke-width", 1);
      });

    // Drag
    const drag = d3.drag()
      .on("start", function(event, d) {
        if (d.isEgo) return;
        if (!event.active) simRef.current.alphaTarget(0.2).restart();
        d.fx = d.x; d.fy = d.y;
      })
      .on("drag", function(event, d) {
        if (d.isEgo) return;
        d.fx = event.x; d.fy = event.y;
      })
      .on("end", function(event, d) {
        if (d.isEgo) return;
        if (!event.active) simRef.current.alphaTarget(0);
        d.fx = null; d.fy = null;
      });
    nodeAll.call(drag);

    simRef.current.on("tick", () => {
      linkAll
        .attr("x1", d => d.source.x).attr("y1", d => d.source.y)
        .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
      nodeAll.attr("transform", d => `translate(${d.x}, ${d.y})`);
    });
  }, [actors, org.orgName, size.w, size.h]);

  return (
    <div ref={containerRef} style={{ width: "100%", height: "100%", position: "relative" }}>
      <svg ref={svgRef} className="map-svg" viewBox={`0 0 ${size.w} ${size.h}`} preserveAspectRatio="xMidYMid meet">
        <g className="links"></g>
        <g className="nodes"></g>
      </svg>

      <div className="legend">
        <h3>Actor type</h3>
        {ACTOR_TYPES.map(t => (
          <div className="item" key={t.value}>
            <span className="swatch" style={{ background: t.color }}></span>
            <span>{t.label}</span>
          </div>
        ))}
        <h3>Constituency size</h3>
        {CONSTITUENCY.map(c => (
          <div className="item" key={c.value}>
            <span className="swatch size-swatch" style={{ width: c.radius * 0.6, height: c.radius * 0.6 }}></span>
            <span>{c.label}</span>
          </div>
        ))}
        <h3>Highest face of power</h3>
        <div style={{fontSize:11, fontStyle:"italic", color:"var(--mute)", lineHeight:1.4, marginBottom:6}}>
          If an actor is engaged across multiple faces, the edge shows the highest.
        </div>
        {[3, 2, 1, 0].map(f => {
          const s = EDGE_STYLE[f];
          const label = f === 0 ? "No relationship (isolated)"
                      : f === 1 ? "Shared policy interest / campaign"
                      : f === 2 ? "Agenda-setting" : "Co-conspirator (values / ideology)";
          return (
            <div className="item" key={f}>
              <svg className="edge-swatch" width="28" height="10">
                {s ? (
                  <line x1="0" y1="5" x2="28" y2="5"
                    stroke={s.stroke} strokeWidth={s.width}
                    strokeDasharray={s.dash || ""}
                    opacity={s.opacity}/>
                ) : null}
              </svg>
              <span>{label}</span>
            </div>
          );
        })}
      </div>

      {tip && tip.actor && (
        <div className="map-tooltip" style={{
          left: Math.min(tip.x + 14, size.w - 270),
          top: Math.min(tip.y + 14, size.h - 120)
        }}>
          <div className="tt-name">{tip.actor.name}</div>
          <div className="tt-meta">
            {[tip.actor.title, tip.actor.organization].filter(Boolean).join(" · ")}
          </div>
          <div className="tt-meta">{lookupType(tip.actor.actorType).label} · {lookupConst(tip.actor.constituency).label}</div>
          <div className="tt-faces">
            {tip.actor.faces && tip.actor.faces.length
              ? (tip.actor.faces.includes(0) ? "Face 0 — No power relationship" : "Faces " + tip.actor.faces.join(", "))
              : "Faces unset"}
          </div>
        </div>
      )}
    </div>
  );
}

/* ========= Power grid view ========= */

function PowerGrid({ actors, onUpdateActor }) {
  const hostRef = useRef(null);
  const svgRef = useRef(null);
  const [size, setSize] = useState({ w: 800, h: 600 });
  const [tip, setTip] = useState(null);
  const [dragId, setDragId] = useState(null);

  useEffect(() => {
    if (!hostRef.current) return;
    const ro = new ResizeObserver(entries => {
      const r = entries[0].contentRect;
      setSize({ w: r.width, h: r.height });
    });
    ro.observe(hostRef.current);
    return () => ro.disconnect();
  }, []);

  const PAD_X = 110;
  const PAD_Y = 70;
  const plotSide = Math.max(200, Math.min(size.w - PAD_X * 2, size.h - PAD_Y * 2));
  const cx = size.w / 2, cy = size.h / 2;
  const half = plotSide / 2;
  const xFor = (gx) => cx + gx * half;
  const yFor = (gy) => cy - gy * half;
  const fromPx = (px, py) => {
    const gx = Math.max(-1, Math.min(1, (px - cx) / half));
    const gy = Math.max(-1, Math.min(1, (cy - py) / half));
    return [Number(gx.toFixed(2)), Number(gy.toFixed(2))];
  };

  const onDotDown = (e, actor) => {
    e.preventDefault(); e.stopPropagation();
    setDragId(actor.id);
  };
  useEffect(() => {
    if (!dragId) return;
    const move = (e) => {
      const rect = svgRef.current.getBoundingClientRect();
      const sx = (e.clientX - rect.left) * (size.w / rect.width);
      const sy = (e.clientY - rect.top) * (size.h / rect.height);
      const [gx, gy] = fromPx(sx, sy);
      onUpdateActor(dragId, { gridX: gx, gridY: gy });
    };
    const up = () => setDragId(null);
    window.addEventListener("mousemove", move);
    window.addEventListener("mouseup", up);
    return () => {
      window.removeEventListener("mousemove", move);
      window.removeEventListener("mouseup", up);
    };
  }, [dragId, size.w, size.h, onUpdateActor]);

  // Quadrant labels
  const quads = [
    { num: "3", strategy: "Engage & redirect",        sx: cx + half * 0.5, sy: cy - half * 0.93 },
    { num: "2", strategy: "Divide & neutralize",      sx: cx - half * 0.5, sy: cy - half * 0.93 },
    { num: "1", strategy: "Organize a base",          sx: cx + half * 0.5, sy: cy + half * 0.93 },
    { num: "4", strategy: "Disorganize / reorganize", sx: cx - half * 0.5, sy: cy + half * 0.93 },
  ];

  return (
    <div ref={hostRef} className="grid-stage">
      <svg ref={svgRef} className="grid-svg" width={size.w} height={size.h} viewBox={`0 0 ${size.w} ${size.h}`}>
        {/* plot background */}
        <rect x={cx - half} y={cy - half} width={plotSide} height={plotSide}
              fill="#f5eedb" stroke="var(--rule)" strokeWidth="1" />
        {/* quadrant subtle bg tints */}
        <rect x={cx} y={cy - half} width={half} height={half} fill="rgba(19,48,107,0.025)" />
        <rect x={cx - half} y={cy - half} width={half} height={half} fill="rgba(183,67,43,0.04)" />
        <rect x={cx} y={cy} width={half} height={half} fill="rgba(107,122,58,0.04)" />
        <rect x={cx - half} y={cy} width={half} height={half} fill="rgba(74,85,102,0.035)" />

        {/* axes */}
        <line x1={cx - half} y1={cy} x2={cx + half} y2={cy} stroke="var(--rule)" strokeWidth="1" />
        <line x1={cx} y1={cy - half} x2={cx} y2={cy + half} stroke="var(--rule)" strokeWidth="1" />

        {/* axis labels */}
        <text className="grid-axis-label" x={cx} y={cy - half - 18} textAnchor="middle">Powerful</text>
        <text className="grid-axis-label" x={cx} y={cy + half + 28} textAnchor="middle">Not powerful</text>
        <text className="grid-axis-label" x={cx - half - 12} y={cy} textAnchor="end" dominantBaseline="middle">Opponent</text>
        <text className="grid-axis-label" x={cx + half + 12} y={cy} textAnchor="start" dominantBaseline="middle">Supporter</text>

        {/* quadrant strategy labels */}
        {quads.map((q, i) => (
          <g key={i}>
            <text className="grid-quad-label" x={q.sx} y={q.sy} textAnchor="middle">{q.num}</text>
            <text className="grid-quad-strategy" x={q.sx} y={q.sy + 16} textAnchor="middle">{q.strategy}</text>
          </g>
        ))}

        {/* actor dots */}
        {actors.map(a => {
          const t = lookupType(a.actorType);
          const c = lookupConst(a.constituency);
          const ax = xFor(a.gridX ?? 0);
          const ay = yFor(a.gridY ?? 0);
          const isOpponent = (a.gridX ?? 0) < 0;
          return (
            <g key={a.id}
               className={"grid-dot" + (dragId === a.id ? " dragging" : "")}
               transform={`translate(${ax}, ${ay})`}
               onMouseDown={(e) => onDotDown(e, a)}
               onMouseEnter={(e) => {
                 const rect = hostRef.current.getBoundingClientRect();
                 setTip({
                   x: e.clientX - rect.left,
                   y: e.clientY - rect.top,
                   actor: a
                 });
               }}
               onMouseMove={(e) => {
                 if (!tip) return;
                 const rect = hostRef.current.getBoundingClientRect();
                 setTip(t => t ? { ...t, x: e.clientX - rect.left, y: e.clientY - rect.top } : t);
               }}
               onMouseLeave={() => setTip(null)}>
              <circle r={c.radius * 0.7} fill={t.color}
                      stroke={isOpponent ? "var(--terracotta)" : "rgba(23,21,20,0.3)"}
                      strokeWidth={isOpponent ? 2 : 1}
                      opacity="0.92" />
              <text x="0" y={c.radius * 0.7 + 13} textAnchor="middle"
                    className="node-label" style={{fontSize: 10.5}}>
                {a.name.split(" ").slice(-2).join(" ")}
              </text>
            </g>
          );
        })}
      </svg>

      <div className="legend" style={{top: 18, right: 18}}>
        <h3>Quadrants (Cushman, 2014/2023)</h3>
        <div className="item"><span style={{fontFamily:"var(--mono)",fontSize:10,color:"var(--cobalt)",width:14}}>1</span><span>Organize a base — lower right</span></div>
        <div className="item"><span style={{fontFamily:"var(--mono)",fontSize:10,color:"var(--cobalt)",width:14}}>2</span><span>Divide & neutralize — upper left</span></div>
        <div className="item"><span style={{fontFamily:"var(--mono)",fontSize:10,color:"var(--cobalt)",width:14}}>3</span><span>Engage & redirect — upper right</span></div>
        <div className="item"><span style={{fontFamily:"var(--mono)",fontSize:10,color:"var(--cobalt)",width:14}}>4</span><span>Disorganize / reorganize — lower left</span></div>
        <h3>Tip</h3>
        <div className="item" style={{fontSize: 11, fontStyle:"italic", color:"var(--mute)"}}>
          Drag any dot to reposition. Edit in the form for precise coords.
        </div>
      </div>

      {tip && tip.actor && (
        <div className="map-tooltip" style={{
          left: Math.min(tip.x + 14, size.w - 270),
          top: Math.min(tip.y + 14, size.h - 120)
        }}>
          <div className="tt-name">{tip.actor.name}</div>
          <div className="tt-meta">{[tip.actor.title, tip.actor.organization].filter(Boolean).join(" · ")}</div>
          <div className="tt-meta">{lookupType(tip.actor.actorType).label} · {lookupConst(tip.actor.constituency).label}</div>
          <div className="tt-faces">
            Grid: {(tip.actor.gridX ?? 0) >= 0 ? "Supporter +" : "Opponent "}{Math.abs(tip.actor.gridX ?? 0).toFixed(2)}
            {" · "}
            {(tip.actor.gridY ?? 0) >= 0 ? "Powerful +" : "Not powerful "}{Math.abs(tip.actor.gridY ?? 0).toFixed(2)}
          </div>
        </div>
      )}
    </div>
  );
}

/* ========= App ========= */

function App() {
  const [org, setOrg] = useState(SEED_ORG);
  const [actors, setActors] = useState(seedActors());
  const [orgOpen, setOrgOpen] = useState(false);
  const [addOpen, setAddOpen] = useState(true);
  const [listOpen, setListOpen] = useState(true);
  const [view, setView] = useState("grid"); // power grid is the default — most familiar to organizers
  // Snapshot metadata — explicit so cross-snapshot deltas have a baseline
  const today = new Date().toISOString().slice(0, 10);
  const [snapshotDate, setSnapshotDate] = useState(today);
  const [filledOutBy, setFilledOutBy] = useState("");

  const addActor = useCallback((draft) => {
    setActors(prev => [...prev, { ...draft, id: "a" + (Date.now()) + Math.floor(Math.random()*1000) }]);
  }, []);
  const updateActor = useCallback((id, draft) => {
    setActors(prev => prev.map(a => a.id === id ? { ...a, ...draft, id } : a));
  }, []);
  const deleteActor = useCallback((id) => {
    setActors(prev => prev.filter(a => a.id !== id));
  }, []);

  const reset = () => {
    setOrg(SEED_ORG);
    setActors(seedActors());
  };

  const exportJSON = () => {
    const payload = {
      snapshotDate,
      filledOutBy: filledOutBy || null,
      org,
      actors,
      exportedAt: new Date().toISOString(),
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `power-map-${snapshotDate}-${(org.orgName || "untitled").toLowerCase().replace(/[^a-z0-9]+/g,"-")}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  return (
    <div className="app">
      <header className="topbar">
        <div className="title-block">
          <span className="wordmark">Power Mapping</span>
          <span style={{display:"block", fontSize:11, color:"var(--mute)", marginTop:2, letterSpacing:".02em"}}>
            Snapshot of where actors stand today. The grid will change over time.
          </span>
        </div>
        <div style={{display:"flex", alignItems:"center", gap:14}}>
          <div style={{display:"flex", alignItems:"center", gap:8}}>
            <label style={{fontSize:11, color:"var(--mute)", textTransform:"uppercase", letterSpacing:".08em", fontWeight:600}}>Filled out by</label>
            <input
              type="text"
              value={filledOutBy}
              onChange={(e) => setFilledOutBy(e.target.value)}
              placeholder="Your name"
              style={{
                fontFamily:"var(--sans)", fontSize:13, padding:"5px 8px",
                border:"1px solid var(--rule)", borderRadius:6, background:"var(--paper)",
                color:"var(--ink)", minWidth:140,
              }}
            />
          </div>
          <div style={{display:"flex", alignItems:"center", gap:8}}>
            <label style={{fontSize:11, color:"var(--mute)", textTransform:"uppercase", letterSpacing:".08em", fontWeight:600}}>Date</label>
            <input
              type="date"
              value={snapshotDate}
              onChange={(e) => setSnapshotDate(e.target.value)}
              style={{
                fontFamily:"var(--sans)", fontSize:13, padding:"5px 8px",
                border:"1px solid var(--rule)", borderRadius:6, background:"var(--paper)",
                color:"var(--ink)",
              }}
            />
          </div>
          <div className="top-actions">
            <button className="btn btn-ghost" onClick={exportJSON}>Export</button>
            <button className="btn btn-ghost" onClick={reset}>Reset</button>
          </div>
        </div>
      </header>

      <div className="pane-wrap">
        <aside className="left-pane">

          <div style={{padding:"20px 20px 4px"}}>
            <h1 style={{fontFamily:"var(--serif)", fontSize:22, fontWeight:400, margin:"0 0 4px"}}>Power Actors & Relationships</h1>
            <p style={{fontFamily:"var(--serif)", fontSize:13, color:"var(--ink-2)", margin:"0 0 8px", lineHeight:1.5}}>
              A snapshot of who shapes your organization's ability to make progress on its goals — and how power is currently functioning in each relationship.
            </p>
          </div>

          <section className="section">
            <div className="section-header" onClick={() => setOrgOpen(o => !o)}>
              <h2>Organization & respondents</h2>
              <span className="caret">{orgOpen ? "−" : "+"}</span>
            </div>
            {orgOpen && (
              <div className="section-body">
                <div className="field">
                  <label>Organization name</label>
                  <input value={org.orgName} onChange={e => setOrg({...org, orgName: e.target.value})} />
                </div>
                <div className="field-row">
                  <div className="field">
                    <label>Date</label>
                    <input type="date" value={org.date} onChange={e => setOrg({...org, date: e.target.value})} />
                  </div>
                  <div className="field">
                    <label>Participants</label>
                    <input value={org.participants} onChange={e => setOrg({...org, participants: e.target.value})} placeholder="Roles in attendance" />
                  </div>
                </div>
                <p className="note-line">The org sits at the center of the map. Its name renders as the ego node label.</p>
              </div>
            )}
          </section>

          <section className="section">
            <div className="section-header" onClick={() => setAddOpen(o => !o)}>
              <h2>Add a power actor</h2>
              <span className="caret">{addOpen ? "−" : "+"}</span>
            </div>
            {addOpen && (
              <div className="section-body">
                <ActorForm onCommit={addActor} />
              </div>
            )}
          </section>

          <section className="section">
            <div className="section-header" onClick={() => setListOpen(o => !o)}>
              <h2>Actors entered ({actors.length})</h2>
              <span className="caret">{listOpen ? "−" : "+"}</span>
            </div>
            {listOpen && (
              <div className="section-body">
                {actors.length === 0 ? (
                  <div className="empty">No actors yet. Add one above to populate the map.</div>
                ) : (
                  <div className="actor-list">
                    {actors.map(a => (
                      <ActorCard key={a.id} actor={a} onUpdate={updateActor} onDelete={deleteActor} />
                    ))}
                  </div>
                )}
              </div>
            )}
          </section>

          <div className="footer-hint">
            Mockup for methodology review — not a production instrument (yet).
          </div>
        </aside>

        <main className="right-pane">
          <div className="tabs">
            <button className={"tab" + (view === "grid" ? " active" : "")} onClick={() => setView("grid")}>Power grid</button>
            <button className={"tab" + (view === "network" ? " active" : "")} onClick={() => setView("network")}>Network</button>
          </div>
          <div className="view-host">
            {view === "network"
              ? <NetworkMap org={org} actors={actors} />
              : <PowerGrid actors={actors} onUpdateActor={updateActor} />}
          </div>
        </main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
